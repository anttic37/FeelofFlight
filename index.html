<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flighfeel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; height: 100%; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: ui-monospace, Consolas, monospace; color: #eaf4ff; }
  .panel { background: rgba(8, 16, 26, 0.45); border: 1px solid rgba(160, 210, 255, 0.18); border-radius: 8px; backdrop-filter: blur(3px); }
  #brand { position: absolute; top: 14px; right: 16px; font-size: 13px; letter-spacing: 3px; color: rgba(230,244,255,0.75); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  /* instrument panel: dial strip pinned to the bottom, annunciators above it.
     transform-origin bottom center so the narrow-screen scale keeps it seated. */
  #panel { position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%); transform-origin: bottom center; }
  #gauges { display: block; filter: drop-shadow(0 3px 10px rgba(0,0,0,0.55)); }
  @media (max-width: 900px) { #panel { transform: translateX(-50%) scale(0.78); } }
  @media (max-width: 700px) { #panel { transform: translateX(-50%) scale(0.6); } }
  #chips { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; }
  #chips .chip { font-size: 10px; letter-spacing: 1.5px; padding: 2px 8px 3px; border-radius: 4px; border: 1px solid rgba(160,210,255,0.22); color: rgba(180,215,245,0.45); }
  #chips #gear-chip.down { color: #8effb0; border-color: rgba(110,255,160,0.5); background: rgba(70,200,110,0.12); }
  #chips #gear-chip.transit { color: #ffc861; border-color: rgba(255,200,95,0.6); animation: blink 0.4s steps(2) infinite; }
  #chips #brake-chip { display: none; }
  #chips #brake-chip.on { display: inline-block; color: #ffc98a; border-color: rgba(255,170,80,0.55); background: rgba(255,150,60,0.14); }
  #chips #flap-chip.f1, #chips #flap-chip.f2 { color: #ffc861; border-color: rgba(255,200,95,0.55); background: rgba(255,180,70,0.10); }
  #chips #flap-chip.transit { animation: blink 0.4s steps(2) infinite; }
  #minimap { position: absolute; top: 40px; right: 16px; width: 140px; height: 140px; }
  #stall { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; letter-spacing: 8px; color: #ff5a4d; text-shadow: 0 0 18px rgba(255,60,40,0.8); display: none; animation: blink 0.45s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  #gearwarn { position: absolute; top: 24%; left: 50%; transform: translate(-50%, -50%); font-size: 26px; letter-spacing: 6px; color: #ff5a4d; text-shadow: 0 0 16px rgba(255,60,40,0.85); display: none; animation: pulsewarn 0.7s ease-in-out infinite; }
  @keyframes pulsewarn { 50% { opacity: 0.35; transform: translate(-50%, -50%) scale(1.09); } }
  #overspd { position: absolute; top: 39%; left: 50%; transform: translate(-50%, -50%); font-size: 16px; letter-spacing: 5px; color: #ff5a4d; text-shadow: 0 0 12px rgba(255,60,40,0.8); display: none; animation: pulsewarn 0.55s ease-in-out infinite; }
  #msg { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; letter-spacing: 3px; color: #ffe9b0; text-shadow: 0 1px 8px rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.3s; }
  /* moved up from bottom-left: the dial strip now owns the bottom of the screen */
  #help { position: absolute; top: 14px; left: 16px; padding: 9px 13px; font-size: 11.5px; line-height: 1.75; color: rgba(210,232,250,0.82); }
  #help kbd { background: rgba(140,190,240,0.16); border: 1px solid rgba(160,210,255,0.25); border-radius: 4px; padding: 0 5px; font-family: inherit; }
  #gvign, #gvign-red { position: absolute; inset: 0; opacity: 0; pointer-events: none; will-change: opacity; }
  #gvign { background: radial-gradient(ellipse at center, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 62%, rgba(0,0,0,0.97) 100%); }
  #gvign-red { background: radial-gradient(ellipse at center, rgba(60,0,0,0) 28%, rgba(120,8,8,0.5) 60%, rgba(150,10,14,0.95) 100%); }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { opacity: 0.85; transition: none; }
  #flash.fade { opacity: 0; transition: opacity 0.9s ease-out; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="ui">
  <div id="brand">F L I G H F E E L</div>
  <canvas id="minimap" class="panel" width="280" height="280"></canvas>
  <div id="panel">
    <div id="chips"><span id="gear-chip" class="chip">GEAR UP</span><span id="flap-chip" class="chip">FLAPS UP</span><span id="brake-chip" class="chip">BRAKE</span></div>
    <canvas id="gauges"></canvas>
  </div>
  <div id="stall">STALL</div>
  <div id="gearwarn">GEAR!</div>
  <div id="overspd">OVERSPEED</div>
  <div id="msg"></div>
  <div id="help" class="panel">
    <kbd>S</kbd> pull up &nbsp; <kbd>W</kbd> nose down &nbsp; <kbd>A</kbd>/<kbd>D</kbd> roll &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> rudder<br>
    <kbd>X</kbd>/<kbd>Z</kbd> throttle &nbsp; <kbd>G</kbd> gear &nbsp; <kbd>F</kbd> flaps &nbsp; <kbd>Space</kbd> brake &nbsp; <kbd>T</kbd> next runway<br>
    <kbd>R</kbd> reset &nbsp; <kbd>C</kbd> camera &nbsp; <kbd>V</kbd> view &nbsp; <kbd>I</kbd> invert &nbsp; <kbd>M</kbd> mute &nbsp; mouse drag look &nbsp; wheel zoom &nbsp; gamepad
  </div>
  <div id="gvign"></div>
  <div id="gvign-red"></div>
  <div id="flash"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
