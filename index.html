<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>flighfeel</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0a0e14; height: 100%; }
  canvas { display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; font-family: ui-monospace, Consolas, monospace; color: #eaf4ff; }
  .panel { background: rgba(8, 16, 26, 0.45); border: 1px solid rgba(160, 210, 255, 0.18); border-radius: 8px; backdrop-filter: blur(3px); }
  #brand { position: absolute; top: 14px; right: 16px; font-size: 13px; letter-spacing: 3px; color: rgba(230,244,255,0.75); text-shadow: 0 1px 4px rgba(0,0,0,0.5); }
  #readouts { position: absolute; top: 14px; left: 16px; padding: 10px 14px; font-size: 14px; line-height: 1.65; min-width: 130px; }
  #readouts b { display: inline-block; width: 42px; font-weight: 400; color: rgba(180,215,245,0.6); font-size: 11px; letter-spacing: 1px; }
  #readouts span { font-size: 16px; }
  #throttle-wrap { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); width: 220px; padding: 8px 12px 10px; text-align: center; }
  #throttle-label { font-size: 10px; letter-spacing: 2px; color: rgba(180,215,245,0.65); margin-bottom: 5px; }
  #throttle-track { height: 7px; background: rgba(120,170,220,0.18); border-radius: 4px; overflow: hidden; }
  #throttle-bar { height: 100%; width: 65%; background: linear-gradient(90deg, #57b8ff, #9ef0c0); border-radius: 4px; transition: width 0.1s linear; }
  #stall { position: absolute; top: 32%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; letter-spacing: 8px; color: #ff5a4d; text-shadow: 0 0 18px rgba(255,60,40,0.8); display: none; animation: blink 0.45s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.15; } }
  #msg { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%); font-size: 20px; letter-spacing: 3px; color: #ffe9b0; text-shadow: 0 1px 8px rgba(0,0,0,0.7); opacity: 0; transition: opacity 0.3s; }
  #help { position: absolute; bottom: 16px; left: 16px; padding: 9px 13px; font-size: 11.5px; line-height: 1.75; color: rgba(210,232,250,0.82); }
  #help kbd { background: rgba(140,190,240,0.16); border: 1px solid rgba(160,210,255,0.25); border-radius: 4px; padding: 0 5px; font-family: inherit; }
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { opacity: 0.85; transition: none; }
  #flash.fade { opacity: 0; transition: opacity 0.9s ease-out; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js" } }
</script>
</head>
<body>
<div id="ui">
  <div id="brand">F L I G H F E E L</div>
  <div id="readouts" class="panel">
    <div><b>SPD</b> <span id="spd">0</span> km/h</div>
    <div><b>ALT</b> <span id="alt">0</span> m</div>
    <div><b>G</b> <span id="g">1.0</span></div>
  </div>
  <div id="throttle-wrap" class="panel">
    <div id="throttle-label">THROTTLE <span id="thr-pct">65</span>%</div>
    <div id="throttle-track"><div id="throttle-bar"></div></div>
  </div>
  <div id="stall">STALL</div>
  <div id="msg"></div>
  <div id="help" class="panel">
    <kbd>S</kbd> pull up &nbsp; <kbd>W</kbd> nose down &nbsp; <kbd>A</kbd>/<kbd>D</kbd> roll &nbsp; <kbd>Q</kbd>/<kbd>E</kbd> rudder<br>
    <kbd>X</kbd>/<kbd>Z</kbd> throttle &nbsp; <kbd>R</kbd> reset &nbsp; <kbd>I</kbd> invert &nbsp; <kbd>M</kbd> mute<br>
    mouse drag look &nbsp; wheel zoom &nbsp; gamepad: stick + triggers
  </div>
  <div id="flash"></div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
